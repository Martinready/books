<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#eceef6;--sub:#9aa3ba;--pri:#818cf8;--ok:#4ade80;--bad:#f87171;--bd:#2d3348;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:16px}

.sub{color:var(--sub);font-size:14px}

.chip{flex:1;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;font-weight:600}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{padding:16px 10px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;text-align:center}
.mode b{display:block;font-size:28px}.mode small{color:var(--sub)}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-size:16px;font-weight:600;margin-top:10px}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.big{font-size:30px;font-weight:700;text-align:center;margin:18px 0 6px}
.mid{font-size:20px;text-align:center;margin:12px 0}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pri)}
.words{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;margin:10px 0}
.w{padding:9px 13px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:17px}
.ans{min-height:56px;border-bottom:2px dashed var(--bd);padding-bottom:6px}
.opt{display:block;width:100%;text-align:left;padding:13px;margin-top:8px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
.ok{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.bad{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.say{width:84px;height:84px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:32px;display:block;margin:14px auto}
.say.rec{background:var(--bad)}
.back{background:none;border:0;color:var(--pri);font-size:15px;padding:4px 0}
.fb{text-align:center;font-weight:600;min-height:26px;margin-top:6px}
.spk{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:50%;width:44px;height:44px;font-size:20px;display:block;margin:0 auto}
textarea,#q,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:6px 0}textarea{min-height:110px}select{width:auto;margin:0}.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
</style>
</head>

 if(k=="e"){cor=it[0];pool=sents().map(function(x){return x[0]});S.rev=it[1];ttl="選出你聽到的句子"}
 else if(k=="z"){cor=it[1];pool=sents().map(function(x){return x[1]});S.rev=it[0];ttl="選出正確的中文意思"}
 else{cor=it[1];pool=it[2];S.rev=it[0]+"（"+it[3]+"）";ttl="選出最合適的回應"}
 S.ans=cor;S.o=opts(cor,pool,k=="r"?Math.min(c.n,4):c.n);
 $.innerHTML=hdr()+'<div class="card"><div class="mid sub">'+ttl+'</div><div id="tm"></div><button class="say" id="pl" onclick="play()">▶</button><div class="fb" id="pc"></div><div id="ops"></div><div id="nx"></div></div>';
 if(df<5)showOpts();else document.getElementById("pc").textContent="聽完才會出現選項";
 setTimeout(play,300);
}
function play(){var c=SET[df],b=document.getElementById("pl");if(!b||S.lock||S.plays>=c.r)return;S.plays++;var q=QID,left=c.r-S.plays,pc=document.getElementById("pc");
 if(c.r<9&&(df<5||S.shown))pc.textContent=left>0?"還可重播 "+left+" 次":"無法再重播";
 if(left<=0)b.style.opacity=.4;
 say(S.audio,(df>=5&&!S.shown)?function(){if(q==QID)showOpts()}:null);
 if(df>=5&&!S.shown)setTimeout(function(){if(q==QID)showOpts()},8000)}
function showOpts(){if(S.shown||S.lock)return;S.shown=true;var h="";
 S.o.forEach(function(t){h+='<button class="opt" onclick="choose(this)" data-t="'+t.replace(/"/g,"&quot;")+'">'+esc(t)+'</button>'});
 document.getElementById("ops").innerHTML=h;var c=SET[df],left=c.r-S.plays,pc=document.getElementById("pc");
 pc.textContent=c.r<9?(left>0?"還可重播 "+left+" 次":"無法再重播"):"";startTimer()}
function startTimer(){var t=SET[df].t;if(!t)return;var s=t;document.getElementById("tm").innerHTML='<div class="bar"><i id="tb" style="width:100%;transition:width 1s linear"></i></div>';
 clearInterval(S.iv);S.iv=setInterval(function(){s--;var b=document.getElementById("tb");if(b)b.style.width=(s/t*100)+"%";if(s<=0){clearInterval(S.iv);tmo()}},1000)}
function mark(){document.querySelectorAll(".opt").forEach(function(x){if(x.getAttribute("data-t")==S.ans)x.classList.add("ok")})}
function choose(b){if(S.lock)return;S.lock=true;clearInterval(S.iv);
 if(b.getAttribute("data-t")==S.ans){b.classList.add("ok");S.ok++}else{b.classList.add("bad");mark()}fin()}
function tmo(){if(S.lock)return;S.lock=true;mark();document.getElementById("pc").textContent="⏱ 時間到";fin()}
function fin(){document.getElementById("nx").innerHTML='<div class="mid sub">'+esc(S.rev)+'</div><button class="btn" onclick="next()">下一題</button>'}
function lzhOld(){
 var it=S.items[S.i],pool=shuf(sents().map(function(x){return x[1]}).filter(function(x){return x!=it[1]})),o=shuf([it[1]].concat(pool.slice(0,2)));
 S.ans=it[1];S.en=it[0];S.lock=false;
 var h=hdr()+'<div class="card"><div class="mid sub">按下播放，選出正確的中文意思</div><button class="say" onclick="say(S.en)">▶</button>';
 o.forEach(function(t){h+='<button class="opt" onclick="chooseL(this)" data-t="'+t.replace(/"/g,"&quot;")+'">'+esc(t)+'</button>'});
 h+='<div id="nx"></div></div>';$.innerHTML=h;setTimeout(function(){say(S.en)},300);
}
function speak(){
 var it=S.items[S.i];S.rec=null;
 $.innerHTML=hdr()+'<div class="card"><div class="mid" style="font-weight:700;font-size:22px">'+esc(it[0])+'</div><div class="mid sub" style="font-size:15px">'+it[1]+'</div><button class="spk" onclick="say(\''+it[0].replace(/'/g,"\\'")+'\')">🔊</button><button class="say" id="mic" onclick="listenMic()">🎤</button><div class="fb" id="fb">按麥克風開始唸</div><div id="nx"><button class="btn alt" onclick="next()">跳過</button></div></div>';
}
function listenMic(){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition,fb=document.getElementById("fb");
 if(!SR){fb.textContent="此瀏覽器不支援語音辨識，請改用 Chrome 或 Safari";return}
 var r=new SR(),mic=document.getElementById("mic"),it=S.items[S.i];r.lang="en-US";r.interimResults=false;
 mic.classList.add("rec");fb.textContent="聆聽中…";
 r.onresult=function(e){var said=norm(e.results[0][0].transcript),tgt=norm(it[0]),hit=0;
  tgt.forEach(function(w){if(said.indexOf(w)>-1)hit++});var sc=Math.round(hit/tgt.length*100);
  fb.innerHTML='你說：'+esc(said.join(" "))+'<br><span style="color:var(--'+(sc>=70?'ok':'bad')+')">相符度 '+sc+'%'+(sc>=70?' ✔':' 再試一次')+'</span>';
  if(sc>=70){S.ok++;document.getElementById("nx").innerHTML='<button class="btn" onclick="next()">下一題</button>'}};
 r.onerror=function(e){fb.textContent="無法辨識（"+e.error+"），請檢查麥克風權限"};
 r.onend=function(){mic.classList.remove("rec")};
 try{r.start()}catch(e){fb.textContent="無法啟動麥克風"}
}
var BASE=JSON.stringify(D),BK=[],K={};
(function(){var d=JSON.parse(BASE);for(var l in d)d[l].w.concat(d[l].s).forEach(function(x){BK.push(x[0].toLowerCase())})})();
"i you he she it we they a an the is am are was were be been do does did have has had go goes like want eat drink see look come take make get know think say tell help need love good bad big small new old happy name friend water food book house home school work day time year man woman people one two three four five six seven eight nine ten yes no not and or but in on at to from with for of my your his her our me him us them where what who when how why this that here there please thank thanks very much many some morning night today coffee tea breakfast station bank table open".split(" ").forEach(function(w){K[w]=1});
"could would should can will must borrow appointment comfortable delay delayed recommend receipt crowded weekend usually yesterday tomorrow travel hotel ticket airport train jog jogging hiking price cheap expensive before after because often sometimes always never about around between during minutes hour late early traffic".split(" ").forEach(function(w){K[w]=2});
var bank=[];try{bank=JSON.parse(localStorage.getItem("epb")||"[]")}catch(e){}
function persist(){try{localStorage.setItem("epb",JSON.stringify(bank))}catch(e){}}
function rebuild(){D=JSON.parse(BASE);bank.forEach(function(b){var L=D[b.lv];if(L)(b.t=="w"?L.w:L.s).push([b.en,b.zh])})}
function wl(w){return K[w]||(w.length<=5?2:3)}
function grade(en){var w=norm(en);if(w.length==1)return wl(w[0]);var g=w.length*.4;w.forEach(function(x){var k=wl(x);if(k==2)g+=.5;if(k==3)g+=2});
 if(/\b(if|would|been|had|which|although|whose)\b/i.test(en))g+=2;if(/\b(was|were|is|are)\s+\w+ed\b/i.test(en))g+=1.5;if(/\b(have|has)\s+\w+/i.test(en))g+=1;
 return g<=4.5?1:g<=8?2:3}
function addBatch(){var n=0,dup=0,bad=0,c=[0,0,0,0];
 document.getElementById("ba").value.split("\n").forEach(function(l){l=l.trim();if(!l)return;var p=l.split(/[|\t]/),en=(p[0]||"").trim(),zh=(p[1]||"").trim();
  if(!en||!zh||!norm(en).length){bad++;return}
  var key=en.toLowerCase();if(BK.indexOf(key)>-1||bank.some(function(b){return b.en.toLowerCase()==key})){dup++;return}
  var g=grade(en),t=norm(en).length<=2&&!/[.?!]/.test(en)?"w":"s";bank.push({t:t,en:en,zh:zh,lv:LV[g-1],auto:1});n++;c[g]++});
 persist();rebuild();bankPage("新增 "+n+" 筆（A1 "+c[1]+"、A2 "+c[2]+"、B1 "+c[3]+"）"+(dup?"；重複 "+dup:"")+(bad?"；格式錯誤 "+bad+"（需「英文 | 中文」）":""))}
function bankPage(msg){clearInterval(S.iv);
 $.innerHTML='<button class="back" onclick="home()">‹ 返回</button><h1>我的題庫</h1><div class="sub">共 '+bank.length+' 筆。每行一筆，格式：英文 | 中文</div><div class="card"><textarea id="ba" placeholder="apple | 蘋果&#10;I like coffee. | 我喜歡咖啡。"></textarea><button class="btn" onclick="addBatch()">新增並自動分級</button><div class="fb">'+(msg||"")+'</div><div class="sub">1–2 個字視為「單字」，其餘視為「句子」。等級最高到 B1。</div></div><div class="card"><div class="row"><b>瀏覽</b><select id="fl" onchange="listBank()"><option value="">全部</option><option>A1</option><option>A2</option><option>B1</option></select></div><input id="q" placeholder="搜尋" oninput="listBank()"><div id="bl"></div></div><div class="card"><b>備份</b><textarea id="io" placeholder="匯出後複製保存；匯入時貼在這裡"></textarea><div class="grid"><button class="btn alt" onclick="exp()">匯出</button><button class="btn alt" onclick="imp()">匯入</button></div></div>';listBank()}
function listBank(){var f=document.getElementById("fl").value,q=document.getElementById("q").value.toLowerCase(),h="",n=0;
 bank.forEach(function(b,i){if(f&&b.lv!=f)return;if(q&&(b.en+b.zh).toLowerCase().indexOf(q)<0)return;if(n++>=40)return;
  var o=LV.map(function(l){return '<option'+(l==b.lv?' selected':'')+'>'+l+'</option>'}).join("");
  h+='<div class="row2"><div>'+(b.t=="w"?"📖 ":"🧩 ")+'<b>'+esc(b.en)+'</b><div class="sub">'+esc(b.zh)+'</div></div><div style="white-space:nowrap"><select onchange="setBl('+i+',this.value)">'+o+'</select> <button class="w" onclick="delB('+i+')">✕</button></div></div>'});
 document.getElementById("bl").innerHTML=h||'<div class="sub">沒有符合的題目</div>'+(n>40?'':'')}
function setBl(i,v){bank[i].lv=v;bank[i].auto=0;persist();rebuild()}
function delB(i){bank.splice(i,1);persist();rebuild();listBank()}
function exp(){document.getElementById("io").value=JSON.stringify(bank)}
function imp(){try{var a=JSON.parse(document.getElementById("io").value),n=0;if(!Array.isArray(a))throw 0;
 a.forEach(function(b){if(b&&typeof b.en=="string"&&typeof b.zh=="string"&&LV.indexOf(b.lv)>-1&&(b.t=="w"||b.t=="s")&&BK.indexOf(b.en.toLowerCase())<0&&!bank.some(function(x){return x.en.toLowerCase()==b.en.toLowerCase()})){bank.push({t:b.t,en:b.en,zh:b.zh,lv:b.lv,auto:b.auto?1:0});n++}});
 persist();rebuild();bankPage("匯入 "+n+" 筆")}catch(e){bankPage("匯入失敗：格式不正確")}}var CP={};
function campMap(){clearInterval(S.iv);CP.bk=CP.bk||df;var C=P.camp||{},nm=["慢速暖身","稍慢練習","限時挑戰","母語者口語","綜合對話："+D[lv].d.t],
 h='<button class="back" onclick="home()">‹ 返回</button><h1>闖關</h1><div style="display:flex;gap:8px;margin:8px 0">';
 LV.forEach(function(l,i){h+='<button class="chip'+(l==lv?' on':'')+'" onclick="lv=\''+l+'\';campMap()">'+l+' '+LN[i]+'</button>'});
 h+='</div><div class="sub">每關約 8 題，60% 以上過關；越後面越接近母語者。過關才能解鎖下一關。</div>';
 for(var s=1;s<=5;s++){var st=C[lv+s]||0,op=s==1||(C[lv+(s-1)]||0)>0;
  h+='<button class="mode" style="width:100%;margin:8px 0;text-align:left;'+(op?'':'opacity:.5')+'" '+(op?'onclick="campGo('+s+')"':'disabled')+'>'+(op?(s==5?'💬':'⭐'):'🔒')+' 第 '+s+' 關・'+nm[s-1]+'<span style="float:right">'+"★".repeat(st)+"☆".repeat(3-st)+'</span></button>'}
 $.innerHTML=h}
function campGo(s){CP.bk=CP.bk||df;df=s;var ss=shuf(sents()),it=[],ks=[];
 if(s==5){it=D[lv].d.x.slice();ks=it.map(function(){return"resp"})}
 else{var rs=shuf(D[lv].r),si=0,ri=0;["listen","lzh","resp","sent","listen","lzh","resp","sent"].forEach(function(k){it.push(k=="resp"?rs[ri++%rs.length]:ss[si++%ss.length]);ks.push(k)})}
 S={m:"camp",st:s,i:0,ok:0,items:it,ks:ks};show()}
function campEnd(){var n=S.items.length,p=Math.round(S.ok/n*100),st=p>=95?3:p>=80?2:p>=60?1:0,k=lv+S.st;
 P.camp=P.camp||{};if((P.camp[k]||0)<st)P.camp[k]=st;save();
 $.innerHTML='<div class="card"><h2>'+(st?"過關！":"再接再厲")+'</h2><div class="big">'+"★".repeat(st)+"☆".repeat(3-st)+'</div><div class="mid sub">答對 '+S.ok+' / '+n+'（'+p+'%）</div>'+(S.st==5&&st?'<div class="mid">🎉 完成 '+lv+' 世界！</div>':'')+(st&&S.st<5?'<button class="btn" onclick="campGo('+(S.st+1)+')">下一關</button>':'')+'<button class="btn alt" onclick="campGo('+S.st+')">重玩這關</button><button class="btn alt" onclick="campMap()">回關卡地圖</button></div>'}
rebuild();
home();
</script>
