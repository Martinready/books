<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雲端整合入口 Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* 適配手機瀏覽器網址列伸縮 */
      overflow: hidden;
      background: #0f172a;
      color: #f8fafc;
    }

    /* 頂部導覽列 (支援手機響應式) */
    header {
      height: auto;
      min-height: 52px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      gap: 8px;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0; /* 允許 flex 子元素正確收縮 */
      overflow: hidden;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 按鈕樣式 */
    .btn {
      background: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn:hover { background: #2563eb; }
    .btn-secondary { background: #334155; color: #cbd5e1; }
    .btn-secondary:hover { background: #475569; color: #ffffff; }
    .btn-danger { background: #ef4444; }
    .btn-danger:hover { background: #dc2626; }

    /* 頁籤列 (手機支援橫向捲動) */
    .tab-bar {
      display: flex;
      gap: 4px;
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      align-items: center;
      padding-bottom: 2px;
      scrollbar-width: thin; /* Firefox 捲軸美化 */
    }
    .tab-bar::-webkit-scrollbar {
      height: 4px;
    }
    .tab-bar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 2px;
    }

    .tab {
      background: #0f172a;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      border: 1px solid #334155;
      transition: all 0.2s;
      user-select: none;
      white-space: nowrap;
    }
    .tab:hover { background: #1e293b; color: #f8fafc; }
    .tab.active {
      background: #334155;
      color: #ffffff;
      font-weight: 600;
      border-color: #475569;
    }
    .tab-close {
      font-size: 11px;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
    }
    .tab-close:hover { background: #475569; color: #ffffff; }

    /* 主要內容區域 */
    main {
      flex: 1;
      position: relative;
      background: #0f172a;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* 手機滑動流暢化 */
    }

    .page-container {
      position: absolute;
      inset: 0;
      display: none;
      opacity: 0;
      transition: opacity 0.15s ease-in-out;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .page-container.active {
      display: block;
      opacity: 1;
    }

    /* 視圖排版 (適配手機邊距) */
    .view-content {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px 40px 16px;
    }
    .view-title { font-size: 20px; margin-bottom: 6px; }
    .view-desc { color: #94a3b8; margin-bottom: 20px; font-size: 13px; line-height: 1.4; }

    /* 卡片網格 (手機自動改為單欄或彈性填滿) */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 130px;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
    }
    .card h3 { font-size: 16px; margin-bottom: 6px; color: #f8fafc; }
    .card p { font-size: 12px; color: #94a3b8; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-url { font-size: 10px; color: #64748b; margin-top: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 設定頁表單與清單樣式 */
    .settings-section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .settings-section h2 { font-size: 16px; margin-bottom: 12px; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 6px; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; font-weight: 500; }
    .form-control {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus { border-color: #3b82f6; }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      margin-bottom: 8px;
      gap: 8px;
    }
    .item-info { flex: 1; overflow: hidden; }
    .item-title { font-weight: 600; font-size: 13px; color: #f8fafc; }
    .item-sub { font-size: 11px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-actions { display: flex; gap: 6px; }

    /* Loading 提示 */
    #loadingOverlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000; color: #f8fafc; font-size: 14px; gap: 10px; transition: opacity 0.2s;
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #3b82f6;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    iframe { width: 100%; height: 100%; border: none; background: #ffffff; }

    /* 針對超小螢幕手機的微調 */
    @media (max-width: 480px) {
      header { padding: 6px 8px; }
      .view-content { padding: 12px 12px 30px 12px; }
      .view-title { font-size: 18px; }
    }
  </style>
</head>
<body>

  <!-- Loading 遮罩 -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div>正在從雲端載入設定與系統清單...</div>
  </div>

  <!-- 頂部導覽列 -->
  <header>
    <div class="header-left">
      <button class="btn" onclick="showHome()">🏠 首頁</button>
      <div class="tab-bar" id="tabBar"></div>
    </div>
    <div class="header-right">
      <button class="btn btn-secondary" onclick="openSettings()">⚙️ 設定</button>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main id="appContainer">
    
    <!-- 首頁頁面 -->
    <div id="page-home" class="page-container active">
      <div class="view-content">
        <h1 class="view-title">雲端整合入口 Portal</h1>
        <p class="view-desc">點擊下方卡片開啟系統，或點擊右上角「設定」遠端維護您的應用與 Proxy 網址。</p>
        <div class="grid" id="homeCardGrid"></div>
      </div>
    </div>

    <!-- 設定頁面 -->
    <div id="page-settings" class="page-container">
      <div class="view-content">
        <h1 class="view-title">入口網站設定 (同步至 GitHub)</h1>
        <p class="view-desc">修改資料後將直接透過 Worker 提交更新至 GitHub 內的 `home_setting.json`。</p>

        <!-- Worker API 網址設定 -->
        <div class="settings-section">
          <h2>Cloudflare Worker API 閘道設定</h2>
          <div class="form-group">
            <label for="workerApiInput">Worker 服務端點網址 (API Endpoint)</label>
            <input type="text" id="workerApiInput" class="form-control" placeholder="https://your-worker.workers.dev">
          </div>
          <button class="btn" onclick="saveWorkerApiUrl()">儲存 API 網址並重新載入</button>
        </div>

        <!-- 代理網址設定 -->
        <div class="settings-section">
          <h2>Cloudflare Worker 代理網址設定</h2>
          <div class="form-group">
            <label for="proxyInput">Proxy 基礎網址 (?target= 前綴)</label>
            <input type="text" id="proxyInput" class="form-control" placeholder="https://your-proxy.workers.dev/?target=">
          </div>
          <button class="btn" onclick="updateProxyConfig()">更新遠端 Proxy 設定</button>
        </div>

        <!-- 新增 / 編輯卡片表單 -->
        <div class="settings-section">
          <h2 id="formHeader">新增系統卡片</h2>
          <input type="hidden" id="editCardId" value="">
          <div class="form-group">
            <label>系統標題</label>
            <input type="text" id="cardTitle" class="form-control" placeholder="例如：電子書櫃">
          </div>
          <div class="form-group">
            <label>系統介紹描述</label>
            <input type="text" id="cardDesc" class="form-control" placeholder="例如：個人靜態書櫃專案">
          </div>
          <div class="form-group">
            <label>來源網址 (URL)</label>
            <input type="text" id="cardUrl" class="form-control" placeholder="https://martinready.github.io/books">
          </div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn" onclick="handleSaveCard()">確認儲存卡片</button>
            <button class="btn btn-secondary" id="cancelEditBtn" style="display:none;" onclick="resetCardForm()">取消編輯</button>
          </div>
        </div>

        <!-- 現有卡片管理清單 -->
        <div class="settings-section">
          <h2>現有卡片管理</h2>
          <div id="manageCardList"></div>
        </div>

      </div>
    </div>

  </main>

  <script>
    let workerApiUrl = localStorage.getItem('portal_worker_api') || "https://homepage.errmartin3.workers.dev";
    
    let remoteData = {
      proxyUrl: "",
      cards: []
    };

    const activeTabs = new Map();

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('workerApiInput').value = workerApiUrl;
      fetchConfigFromCloud();
    });

    function saveWorkerApiUrl() {
      const val = document.getElementById('workerApiInput').value.trim();
      if (!val) {
        alert('API 網址不可為空！');
        return;
      }
      workerApiUrl = val;
      localStorage.setItem('portal_worker_api', workerApiUrl);
      alert('Worker API 網址已儲存，正在重新取得遠端資料...');
      fetchConfigFromCloud();
    }

    async function fetchConfigFromCloud() {
      showLoading(true);
      try {
        const res = await fetch(workerApiUrl);
        if (!res.ok) throw new Error("無法從雲端讀取設定檔");
        remoteData = await res.json();
        
        document.getElementById('proxyInput').value = remoteData.proxyUrl || "";
        renderHomeCards();
        renderManageList();
      } catch (err) {
        console.error(err);
        alert('讀取雲端設定失敗，請確認 Worker API 網址是否正確或 CORS 設定是否有誤。\n錯誤：' + err.message);
      } finally {
        showLoading(false);
      }
    }

    async function updateProxyConfig() {
      const newProxy = document.getElementById('proxyInput').value.trim();
      showLoading(true);
      try {
        const res = await fetch(workerApiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "update_proxy", proxyUrl: newProxy })
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || "更新失敗");
        
        remoteData = result.data;
        alert('Proxy 網址已成功同步至 GitHub！');
      } catch (err) {
        alert('更新失敗：' + err.message);
      } finally {
        showLoading(false);
      }
    }

    async function handleSaveCard() {
      const cardId = document.getElementById('editCardId').value;
      const title = document.getElementById('cardTitle').value.trim();
      const desc = document.getElementById('cardDesc').value.trim();
      const url = document.getElementById('cardUrl').value.trim();

      if (!title || !url) {
        alert('請填寫「系統標題」與「來源網址」！');
        return;
      }

      showLoading(true);
      try {
        let res, result;
        if (!cardId) {
          res = await fetch(workerApiUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type: "add_card", title, desc, url })
          });
        } else {
          res = await fetch(workerApiUrl, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: cardId, title, desc, url })
          });
        }

        result = await res.json();
        if (!res.ok) throw new Error(result.error || "儲存失敗");

        remoteData = result.data;
        resetCardForm();
        renderHomeCards();
        renderManageList();
        alert('卡片資料已同步至 GitHub！');
      } catch (err) {
        alert('操作失敗：' + err.message);
      } finally {
        showLoading(false);
      }
    }

    async function deleteCard(id, title) {
      if (!confirm(`確定要從 GitHub 刪除「${title}」卡片嗎？`)) return;

      showLoading(true);
      try {
        const res = await fetch(workerApiUrl, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id })
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || "刪除失敗");

        remoteData = result.data;
        resetCardForm();
        renderHomeCards();
        renderManageList();
        alert('已成功刪除並更新 GitHub！');
      } catch (err) {
        alert('刪除失敗：' + err.message);
      } finally {
        showLoading(false);
      }
    }

    function renderHomeCards() {
      const grid = document.getElementById('homeCardGrid');
      grid.innerHTML = '';
      const cards = remoteData.cards || [];

      if (cards.length === 0) {
        grid.innerHTML = '<p style="color:#94a3b8; font-size:13px;">目前尚無任何系統卡片，請至設定新增。</p>';
        return;
      }

      cards.forEach(card => {
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => openTab(card.id, card.title, card.url);
        div.innerHTML = `
          <div>
            <h3>${escapeHtml(card.title)}</h3>
            <p>${escapeHtml(card.desc || '')}</p>
          </div>
          <div class="card-url">🔗 ${escapeHtml(card.url)}</div>
        `;
        grid.appendChild(div);
      });
    }

    function renderManageList() {
      const listContainer = document.getElementById('manageCardList');
      listContainer.innerHTML = '';
      const cards = remoteData.cards || [];

      if (cards.length === 0) {
        listContainer.innerHTML = '<p style="color:#94a3b8; font-size:13px;">目前尚無任何系統卡片。</p>';
        return;
      }

      cards.forEach(card => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div class="item-info">
            <div class="item-title">${escapeHtml(card.title)}</div>
            <div class="item-sub">${escapeHtml(card.url)}</div>
          </div>
          <div class="item-actions">
            <button class="btn btn-secondary" style="padding: 4px 8px; font-size:11px;" onclick="editCard('${card.id}')">修改</button>
            <button class="btn btn-danger" style="padding: 4px 8px; font-size:11px;" onclick="deleteCard('${card.id}', '${escapeHtml(card.title)}')">刪除</button>
          </div>
        `;
        listContainer.appendChild(row);
      });
    }

    function editCard(id) {
      const card = (remoteData.cards || []).find(c => c.id === id);
      if (!card) return;

      document.getElementById('editCardId').value = card.id;
      document.getElementById('cardTitle').value = card.title;
      document.getElementById('cardDesc').value = card.desc || '';
      document.getElementById('cardUrl').value = card.url;
      document.getElementById('formHeader').innerText = `修改卡片: ${card.title}`;
      document.getElementById('cancelEditBtn').style.display = 'inline-block';
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    function resetCardForm() {
      document.getElementById('editCardId').value = '';
      document.getElementById('cardTitle').value = '';
      document.getElementById('cardDesc').value = '';
      document.getElementById('cardUrl').value = '';
      document.getElementById('formHeader').innerText = '新增系統卡片';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    function openTab(id, title, rawUrl) {
      if (!activeTabs.has(id)) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page-container';
        pageDiv.id = `page-${id}`;

        const proxyBase = remoteData.proxyUrl || "";
        const proxiedUrl = proxyBase + encodeURIComponent(rawUrl);
        pageDiv.innerHTML = `<iframe src="${proxiedUrl}" loading="lazy"></iframe>`;
        document.getElementById('appContainer').appendChild(pageDiv);

        activeTabs.set(id, { title, rawUrl });
      }
      switchTab(id);
    }

    function switchTab(targetId) {
      document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
      const targetPage = document.getElementById(`page-${targetId}`);
      if (targetPage) targetPage.classList.add('active');
      renderTabBar(targetId);
    }

    function showHome() { switchTab('home'); }
    function openSettings() { switchTab('settings'); renderManageList(); }

    function closeTab(event, id) {
      event.stopPropagation();
      const pageEl = document.getElementById(`page-${id}`);
      if (pageEl) pageEl.remove();
      activeTabs.delete(id);

      const activeTabEl = document.querySelector('.tab.active');
      if (activeTabEl && activeTabEl.dataset.id === id) {
        showHome();
      } else {
        renderTabBar();
      }
    }

    function renderTabBar(activeId = 'home') {
      const tabBar = document.getElementById('tabBar');
      tabBar.innerHTML = '';

      activeTabs.forEach((tabData, id) => {
        const tab = document.createElement('div');
        tab.className = `tab ${id === activeId ? 'active' : ''}`;
        tab.dataset.id = id;
        tab.onclick = () => switchTab(id);
        tab.innerHTML = `
          <span>${escapeHtml(tabData.title)}</span>
          <span class="tab-close" onclick="closeTab(event, '${id}')">✕</span>
        `;
        tabBar.appendChild(tab);
      });
    }

    function showLoading(show) {
      const overlay = document.getElementById('loadingOverlay');
      overlay.style.display = show ? 'flex' : 'none';
      overlay.style.opacity = show ? '1' : '0';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
